name: Deploy to GitHub Pages

# Publishes two versions of the site side by side:
#   main  -> https://<owner>.github.io/<repo>/      (current site)
#   room  -> https://<owner>.github.io/<repo>/v2/   (room version, work in progress)
# Pages only accepts deployments from main, so a push to `room` runs the small
# "Room branch changed" workflow, which triggers this one on main.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Room branch changed"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: room
          path: room
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current site (main)
        working-directory: main
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Build room version (room) into /v2/
        if: hashFiles('room/package.json') != ''
        working-directory: room
        run: npm ci && npm run build && mkdir -p ../main/out/v2 && cp -r out/. ../main/out/v2/
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/v2
      - run: touch main/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
