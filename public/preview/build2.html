<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build · 2 · Floor-plan path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1B1916}
body{font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1E1C19}
.pad{min-height:45svh;background:#FAF8F4;display:flex;align-items:flex-end;padding:0 22px 36px}
.pad p{margin:0;color:#5A544B;font-weight:300;line-height:1.55;max-width:22rem}
.pad.end{align-items:flex-start;padding-top:36px}
.track{height:330svh;position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;background:#1B1916}
.cap{position:absolute;left:0;right:0;top:0;z-index:5;background:#FAF8F4;padding:calc(22px + env(safe-area-inset-top)) 22px 22px;box-shadow:0 24px 40px -26px rgba(0,0,0,.55)}
.cap h3{margin:0;font-family:Marcellus,serif;font-weight:400;text-transform:uppercase;letter-spacing:.07em;font-size:clamp(1.45rem,6.6vw,2.1rem);line-height:1.1}
.cap p{margin:10px 0 0;font-size:1rem;line-height:1.55;color:#4E483F;max-width:34rem}
.view{position:absolute;inset:0}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity}
.note{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(250,248,244,.7);z-index:9;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.ph{opacity:0;transition:opacity .5s ease}
.ph.on{opacity:1}
.r1{background-image:url(../images/restaurant.webp)}.r2{background-image:url(../images/lounge.webp)}.r3{background-image:url(../images/suite.webp)}.r4{background-image:url(../images/villa.webp)}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,15,.2) 0%,rgba(20,18,15,.55) 45%,rgba(20,18,15,.8) 100%)}
.plan{position:absolute;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));width:min(88vw,460px);transform:translateX(-50%)}
.plan svg{width:100%;height:auto;display:block;overflow:visible}
.plan .wall{fill:rgba(250,248,244,.06);stroke:rgba(217,190,140,.85);stroke-width:1.2}
.plan .door{stroke:#1B1916;stroke-width:4}
.plan .route{fill:none;stroke:rgba(250,248,244,.35);stroke-width:1.4;stroke-dasharray:4 5}
.plan .done{fill:none;stroke:#D9BE8C;stroke-width:2}
.plan .pt{fill:#1B1916;stroke:#D9BE8C;stroke-width:1.6}
.plan .pt.on{fill:#D9BE8C}
.plan text{fill:rgba(250,248,244,.85);font:500 9px Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.plan .me{fill:#fff;stroke:#D9BE8C;stroke-width:3}
.room{position:absolute;left:22px;bottom:calc(36px + env(safe-area-inset-bottom) + min(88vw,460px) * .62 + 14px);color:#FAF8F4;font-family:Marcellus,serif;text-transform:uppercase;letter-spacing:.1em;font-size:.95rem}

</style>
</head>
<body>
<div class="pad"><p>Option 2 · Floor-plan path. Scroll down.</p></div>
<div class="track" id="track">
  <div class="stage">
    <div class="view" id="view"><div class="ph r1 on"></div><div class="ph r2"></div><div class="ph r3"></div><div class="ph r4"></div><div class="dim"></div>
<div class="room" id="room">Restaurant</div>
<div class="plan"><svg viewBox="0 0 300 186" id="plan">
<rect class="wall" x="2" y="2" width="160" height="100"/><rect class="wall" x="162" y="2" width="136" height="100"/>
<rect class="wall" x="2" y="102" width="120" height="82"/><rect class="wall" x="122" y="102" width="176" height="82"/>
<line class="door" x1="162" y1="40" x2="162" y2="62"/><line class="door" x1="215" y1="102" x2="238" y2="102"/><line class="door" x1="122" y1="130" x2="122" y2="152"/>
<path class="route" id="route" d="M80 52 L162 51 L226 51 L226 102 L226 142 L122 141 L62 141"/>
<path class="done" id="done" d="M80 52 L162 51 L226 51 L226 102 L226 142 L122 141 L62 141"/>
<circle class="pt" cx="80" cy="52" r="6"/><circle class="pt" cx="226" cy="51" r="6"/><circle class="pt" cx="226" cy="142" r="6"/><circle class="pt" cx="62" cy="141" r="6"/>
<text x="12" y="18">Restaurant</text><text x="172" y="18">Lounge</text><text x="132" y="178">Suite</text><text x="12" y="178">Terrace</text>
<circle class="me" id="me" r="7" cx="80" cy="52"/>
</svg></div></div>
    <div class="cap"><h3>We build the tour</h3><p>We stitch the photos together and link the rooms, so people can walk from one to the next.</p></div>
  </div>
</div>
<div class="pad end"><p>Next: “It goes live on Google”.</p></div>
<div class="note">Build option 2 of 3</div>
<script>
(() => {
  const track = document.getElementById('track');
  const cl = (x) => Math.max(0, Math.min(1, x));
  const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const seg = (p, a, b) => io(cl((p - a) / (b - a)));
  let raf = 0, last = -1;
  
  const route = document.getElementById('route'), done = document.getElementById('done'), me = document.getElementById('me');
  const phs = [...document.querySelectorAll('.ph')], pts = [...document.querySelectorAll('.pt')], room = document.getElementById('room');
  const L = route.getTotalLength();
  // where each camera point sits along the route
  const at = [0, 146, 237, 401].map((x) => x / 401);
  const names = ['Restaurant', 'Lounge', 'Suite', 'Terrace'];
  done.style.strokeDasharray = L; let cur = -1;
  const draw = (p) => {
    const k = seg(p, 0.08, 0.9);
    const pt = route.getPointAtLength(k * L);
    me.setAttribute('cx', pt.x.toFixed(1)); me.setAttribute('cy', pt.y.toFixed(1));
    done.style.strokeDashoffset = (L * (1 - k)).toFixed(1);
    let i = 0; at.forEach((a, j) => { if (k >= a - 0.01) i = j; });
    pts.forEach((c, j) => c.classList.toggle('on', j <= i));
    if (i !== cur) { cur = i; phs.forEach((e, j) => e.classList.toggle('on', j === i)); room.textContent = names[i]; }
  };

  const tick = () => { raf = 0; const r = track.getBoundingClientRect(); const p = cl(-r.top / Math.max(1, r.height - innerHeight)); if (Math.abs(p - last) < 0.0005) return; last = p; draw(p); };
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
  addEventListener('resize', () => { last = -1; if (typeof fit === 'function') fit(); tick(); });
  if (typeof fit === 'function') fit();
  tick();
})();
</script>
</body>
</html>
