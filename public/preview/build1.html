<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build · 1 · Walk into the next room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1B1916}
body{font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1E1C19}
.pad{min-height:45svh;background:#FAF8F4;display:flex;align-items:flex-end;padding:0 22px 36px}
.pad p{margin:0;color:#5A544B;font-weight:300;line-height:1.55;max-width:22rem}
.pad.end{align-items:flex-start;padding-top:36px}
.track{height:330svh;position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;background:#1B1916}
.cap{position:absolute;left:0;right:0;top:0;z-index:5;background:#FAF8F4;padding:calc(22px + env(safe-area-inset-top)) 22px 22px;box-shadow:0 24px 40px -26px rgba(0,0,0,.55)}
.cap h3{margin:0;font-family:Marcellus,serif;font-weight:400;text-transform:uppercase;letter-spacing:.07em;font-size:clamp(1.45rem,6.6vw,2.1rem);line-height:1.1}
.cap p{margin:10px 0 0;font-size:1rem;line-height:1.55;color:#4E483F;max-width:34rem}
.view{position:absolute;inset:0}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity}
.note{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(250,248,244,.7);z-index:9;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.a{background-image:url(../images/restaurant.webp)}
.b{background-image:url(../images/lounge.webp);opacity:0}
.spot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 6px 24px rgba(0,0,0,.35);pointer-events:none}
.spot::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.75);animation:pulse 1.8s ease-out infinite}
.spot i{position:absolute;inset:22px;border-radius:50%;background:#fff}
.lab{position:absolute;transform:translate(-50%,0);margin-top:46px;background:rgba(32,33,36,.78);color:#fff;font-size:.78rem;font-weight:500;padding:6px 12px;border-radius:14px;white-space:nowrap;pointer-events:none}
@keyframes pulse{from{transform:scale(.8);opacity:1}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.spot::after{animation:none}}

</style>
</head>
<body>
<div class="pad"><p>Option 1 · Walk into the next room. Scroll down.</p></div>
<div class="track" id="track">
  <div class="stage">
    <div class="view" id="view"><div class="ph a" id="a"></div><div class="ph b" id="b"></div><div class="spot" id="spot"><i></i></div><div class="lab" id="lab">Lounge</div></div>
    <div class="cap"><h3>We build the tour</h3><p>We stitch the photos together and link the rooms, so people can walk from one to the next.</p></div>
  </div>
</div>
<div class="pad end"><p>Next: “It goes live on Google”.</p></div>
<div class="note">Build option 1 of 3</div>
<script>
(() => {
  const track = document.getElementById('track');
  const cl = (x) => Math.max(0, Math.min(1, x));
  const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const seg = (p, a, b) => io(cl((p - a) / (b - a)));
  let raf = 0, last = -1;
  
  const A = document.getElementById('a'), B = document.getElementById('b'), spot = document.getElementById('spot'), lab = document.getElementById('lab');
  // the far end of the restaurant, where the next room would be
  const SX = 0.58, SY = 0.45;
  const draw = (p) => {
    const z = seg(p, 0.05, 0.62), x = seg(p, 0.5, 0.72), s = seg(p, 0.68, 0.95);
    A.style.transformOrigin = `${SX * 100}% ${SY * 100}%`;
    A.style.transform = `scale(${(1 + 1.6 * z).toFixed(4)})`;
    A.style.opacity = (1 - x).toFixed(3);
    B.style.opacity = x.toFixed(3);
    B.style.transform = `scale(${(1.25 - 0.25 * s).toFixed(4)})`;
    const show = cl(p / 0.06) * (1 - cl((z - 0.55) / 0.3));
    const W = innerWidth, H = innerHeight;
    spot.style.left = lab.style.left = (SX * W) + 'px';
    spot.style.top = (SY * H) + 'px'; lab.style.top = (SY * H) + 'px';
    spot.style.opacity = lab.style.opacity = show.toFixed(3);
    spot.style.transform = `scale(${(1 + 1.4 * z).toFixed(3)})`;
  };

  const tick = () => { raf = 0; const r = track.getBoundingClientRect(); const p = cl(-r.top / Math.max(1, r.height - innerHeight)); if (Math.abs(p - last) < 0.0005) return; last = p; draw(p); };
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
  addEventListener('resize', () => { last = -1; if (typeof fit === 'function') fit(); tick(); });
  if (typeof fit === 'function') fit();
  tick();
})();
</script>
</body>
</html>
