<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build · 3 · Stitch and pan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1B1916}
body{font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1E1C19}
.pad{min-height:45svh;background:#FAF8F4;display:flex;align-items:flex-end;padding:0 22px 36px}
.pad p{margin:0;color:#5A544B;font-weight:300;line-height:1.55;max-width:22rem}
.pad.end{align-items:flex-start;padding-top:36px}
.track{height:330svh;position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;background:#1B1916}
.cap{position:absolute;left:0;right:0;top:0;z-index:5;background:#FAF8F4;padding:calc(22px + env(safe-area-inset-top)) 22px 22px;box-shadow:0 24px 40px -26px rgba(0,0,0,.55)}
.cap h3{margin:0;font-family:Marcellus,serif;font-weight:400;text-transform:uppercase;letter-spacing:.07em;font-size:clamp(1.45rem,6.6vw,2.1rem);line-height:1.1}
.cap p{margin:10px 0 0;font-size:1rem;line-height:1.55;color:#4E483F;max-width:34rem}
.view{position:absolute;inset:0}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity}
.note{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(250,248,244,.7);z-index:9;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.sl{position:absolute;top:0;height:100%;background-image:url(../images/restaurant.webp);will-change:transform}
.seam{position:absolute;top:0;height:100%;width:1px;background:#D9BE8C;box-shadow:0 0 12px rgba(217,190,140,.8)}
.edge{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(20,18,15,.55),rgba(20,18,15,0) 14%,rgba(20,18,15,0) 86%,rgba(20,18,15,.55))}
.pill{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#FAF8F4;font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:10px;opacity:0;white-space:nowrap}
.pill i{width:34px;height:1px;background:#D9BE8C}

</style>
</head>
<body>
<div class="pad"><p>Option 3 · Stitch and pan. Scroll down.</p></div>
<div class="track" id="track">
  <div class="stage">
    <div class="view" id="view"><div id="strip"></div><div class="edge"></div><div class="pill" id="pill"><i></i>One continuous view<i></i></div></div>
    <div class="cap"><h3>We build the tour</h3><p>We stitch the photos together and link the rooms, so people can walk from one to the next.</p></div>
  </div>
</div>
<div class="pad end"><p>Next: “It goes live on Google”.</p></div>
<div class="note">Build option 3 of 3</div>
<script>
(() => {
  const track = document.getElementById('track');
  const cl = (x) => Math.max(0, Math.min(1, x));
  const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const seg = (p, a, b) => io(cl((p - a) / (b - a)));
  let raf = 0, last = -1;
  
  const strip = document.getElementById('strip'), pill = document.getElementById('pill');
  const N = 8, IMG = 1200 / 880; const sl = [], seams = [];
  for (let i = 0; i < N; i++) { const d = document.createElement('div'); d.className = 'sl'; strip.appendChild(d); sl.push(d); }
  for (let i = 1; i < N; i++) { const s = document.createElement('div'); s.className = 'seam'; strip.appendChild(s); seams.push(s); }
  let W = 0, H = 0, iw = 0, ih = 0;
  const fit = () => { W = innerWidth; H = innerHeight; ih = H; iw = H * IMG; };
  window.fit = fit;
  const draw = (p) => {
    const c = seg(p, 0.04, 0.42), g = seg(p, 0.42, 0.95);
    // the image is wider than the screen: start centred, glide to show how far it goes
    const range = (iw - W) / 2, pan = (g < 0.5 ? -range * (g / 0.5) * 0.9 : -range * 0.9 + range * 1.8 * ((g - 0.5) / 0.5));
    const left0 = (W - iw) / 2 + pan, sw = W / N, gap = 7 * (1 - c);
    sl.forEach((d, i) => {
      const x = i * sw + (i - (N - 1) / 2) * gap;
      d.style.left = x.toFixed(1) + 'px'; d.style.width = (sw + 1).toFixed(1) + 'px';
      d.style.backgroundSize = `${iw}px ${ih}px`;
      d.style.backgroundPosition = `${(left0 - i * sw).toFixed(1)}px 0px`;
    });
    seams.forEach((s, j) => { const i = j + 1; s.style.left = (i * sw + (i - (N - 1) / 2) * gap - gap / 2).toFixed(1) + 'px'; s.style.opacity = (c < 1 ? 0.95 * (1 - cl((c - 0.6) / 0.4)) : 0).toFixed(3); });
    pill.style.opacity = cl((g - 0.05) / 0.2).toFixed(3);
  };

  const tick = () => { raf = 0; const r = track.getBoundingClientRect(); const p = cl(-r.top / Math.max(1, r.height - innerHeight)); if (Math.abs(p - last) < 0.0005) return; last = p; draw(p); };
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
  addEventListener('resize', () => { last = -1; window.fit && window.fit(); tick(); });
  window.fit && window.fit();
  tick();
})();
</script>
</body>
</html>
