<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preview 1 · Tilt to look around</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap">
<style>
:root{--cream:#FAF8F4;--ink:#1E1C19;--gold:#D9BE8C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1B1916;overscroll-behavior:none}
body{font-family:Manrope,system-ui,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:none}
.pano{position:fixed;inset:-8% 0;background:url(../images/pano-strip.webp) 0 50%/auto 100% repeat-x;will-change:background-position;cursor:grab}
.pano:active{cursor:grabbing}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,18,15,.55) 0%,rgba(20,18,15,0) 22%,rgba(20,18,15,0) 45%,rgba(20,18,15,.82) 100%)}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 20px 0}
.logo{display:flex;align-items:center;gap:.7rem;color:var(--cream);text-decoration:none}
.logo img{height:20px}
.logo span{font-family:Marcellus,serif;font-size:.74rem;letter-spacing:.44em}
.cta{font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--cream);text-decoration:none;border:1px solid rgba(250,248,244,.6);padding:11px 14px}
.hud{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .6s}
.ring{width:84px;height:84px;border-radius:50%;border:1px solid rgba(250,248,244,.55);position:relative;margin:0 auto}
.ring i{position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;background:var(--gold);transform:rotate(45deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Marcellus,serif;font-weight:400;font-size:1.05rem;letter-spacing:.06em}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 22px calc(30px + env(safe-area-inset-bottom))}
h1{margin:0;font-family:Marcellus,serif;font-weight:400;text-transform:uppercase;letter-spacing:.07em;font-size:clamp(2.1rem,10.5vw,3rem);line-height:1}
.sub{margin:14px 0 0;font-size:.95rem;line-height:1.55;color:rgba(250,248,244,.84);font-weight:300;max-width:22rem}
.go{margin-top:26px;display:inline-flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);border:0;font:inherit;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;padding:16px 20px;cursor:pointer}
.go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hint{margin:14px 0 0;font-size:.82rem;color:rgba(250,248,244,.72);min-height:1.3em}
.live .go{display:none}
.note{position:fixed;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(250,248,244,.45)}
@media (min-width:700px){.bottom{padding-left:48px;padding-right:48px}.top{padding-left:48px;padding-right:48px}}
@media (prefers-reduced-motion:reduce){.hud{transition:none}}
</style>
</head>
<body>
<div class="pano" id="pano" aria-hidden="true"></div>
<div class="shade"></div>
<header class="top">
  <a class="logo" href="./"><img src="../images/ve-emblem-gold.svg" alt="VantEdge360"><span>VANTEDGE</span></a>
  <a class="cta" href="#">Book a shoot</a>
</header>
<div class="hud" id="hud" aria-hidden="true"><div class="ring" id="ring"><i></i><b id="deg">0°</b></div></div>
<main class="bottom">
  <h1>Step inside<br>before you arrive</h1>
  <p class="sub">360° virtual tours for Google Maps and your Business Profile.</p>
  <button class="go" id="go" type="button"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9c-1 2-1 4 0 6M21 9c1 2 1 4 0 6"/></svg><span id="goTxt">Tilt to look around</span></button>
  <p class="hint" id="hint">Or drag the room with your finger.</p>
</main>
<div class="note">Preview 1 of 3</div>
<script>
(() => {
  const pano = document.getElementById('pano'), deg = document.getElementById('deg'), ring = document.getElementById('ring');
  const hint = document.getElementById('hint'), go = document.getElementById('go'), goTxt = document.getElementById('goTxt');
  const img = new Image(); img.src = '../images/pano-strip.webp';
  const RATIO = 5200 / 1155;
  let yaw = 40, pitch = 0, tYaw = 40, tPitch = 0, base = null, drag = null, sensor = false, idle = performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const frame = (now) => {
    if (!sensor && !drag && !reduce && now - idle > 2500) tYaw += 0.02; // slow drift until someone takes over
    yaw += (tYaw - yaw) * 0.12; pitch += (tPitch - pitch) * 0.12;
    const h = pano.offsetHeight, w = h * RATIO;
    const x = -(((yaw % 360) + 360) % 360) / 360 * w + innerWidth / 2;
    pano.style.backgroundPosition = `${x.toFixed(1)}px ${(50 + pitch).toFixed(2)}%`;
    const d = Math.round(((yaw % 360) + 360) % 360);
    deg.textContent = d + '°';
    ring.querySelector('i').style.transform = `rotate(${45}deg)`;
    ring.style.transform = `rotate(${-d}deg)`; deg.style.transform = `rotate(${d}deg)`;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  // drag to look
  pano.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw: tYaw, pitch: tPitch }; pano.setPointerCapture(e.pointerId); });
  pano.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const h = pano.offsetHeight, w = h * RATIO;
    tYaw = drag.yaw - (e.clientX - drag.x) / w * 360;
    tPitch = Math.max(-18, Math.min(18, drag.pitch - (e.clientY - drag.y) / h * 60));
  });
  const end = () => { drag = null; idle = performance.now(); };
  pano.addEventListener('pointerup', end); pano.addEventListener('pointercancel', end);

  // tilt and turn the phone to look
  const onOri = (e) => {
    if (e.alpha == null) return;
    if (!sensor) { sensor = true; document.body.classList.add('live'); hint.textContent = 'Turn around. The room turns with you.'; }
    // compass heading (alpha) turns the room; leaning the phone forward or back (beta) looks down or up
    if (base == null) base = e.alpha + yaw;
    tYaw = base - e.alpha;
    // keep the yaw continuous across the 0/360 wrap
    while (tYaw - yaw > 180) tYaw -= 360; while (tYaw - yaw < -180) tYaw += 360;
    if (e.beta != null) tPitch = Math.max(-18, Math.min(18, (e.beta - 80) * 0.45));
  };
  const start = async () => {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') { hint.textContent = 'Motion is off for this page. Drag the room instead.'; return; }
      }
      window.addEventListener('deviceorientation', onOri);
      setTimeout(() => { if (!sensor) hint.textContent = 'No motion sensor here. Drag the room instead, or open this on your phone.'; }, 1200);
    } catch (err) { hint.textContent = 'Drag the room to look around.'; }
  };
  go.addEventListener('click', start);
  if (!('DeviceOrientationEvent' in window) || matchMedia('(pointer: fine)').matches) goTxt.textContent = 'Tilt to look around (on a phone)';
})();
</script>
</body>
</html>
